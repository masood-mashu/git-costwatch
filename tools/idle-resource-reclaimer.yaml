name: "idle-resource-reclaimer"
description: "Audits compute and storage for zero-utilization thresholds across multi-cloud accounts"
version: "0.1.0"
runtime:
  language: "python"
  entrypoint: "idle_resource_reclaimer.py"
parameters:
  type: "object"
  properties:
    resource_inventory_json:
      type: "string"
      description: "JSON list of resources with idle_days and type"
  required:
    - "resource_inventory_json"
