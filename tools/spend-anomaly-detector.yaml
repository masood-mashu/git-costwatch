name: spend-anomaly-detector
version: 1.0.0
description: "Computes daily spend z-score relative to rolling historical baseline"
input_schema:
  type: object
  properties:
    spend_data_json:
      type: string
      description: "JSON with current day spend and baseline average"
  required:
    - spend_data_json
implementation:
  type: script
  path: spend_anomaly_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
