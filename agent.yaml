spec_version: "0.1.0"
name: git-costwatch
version: 1.0.0
description: "Autonomous Cloud FinOps, Spend Anomaly & Idle Infrastructure Reclaiming Guardian"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - cloud-finops-framework
  - committed-use-planning

tools:
  - spend-anomaly-detector
  - idle-resource-reclaimer
  - reservation-coverage-scorer

runtime:
  max_turns: 50
  timeout: 120

tags:
  - developer-tools
  - finops
  - cloud-cost
  - spend-anomalies
  - passport-challenge

metadata:
  passport_id: "aps-costwatch-01"
  passport_category: "Developer tools"
